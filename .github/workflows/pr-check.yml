name: Workers checks
on:
  pull_request:
  push:
    branches: [codex/cloudflare-workers]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            admin/package-lock.json
            docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck:worker
      - run: npm run test:e2e:typecheck
      - run: npm test
      - run: npm run deploy -- --dry-run
      - run: npm --prefix docs test
      - run: npx tsc --noEmit -p frontend && npx tsc --noEmit -p admin
      - run: npm --prefix frontend run lint && npm --prefix admin run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
